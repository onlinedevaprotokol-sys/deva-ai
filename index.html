<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEVA-Aİ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #090d16; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .app { display: flex; flex-direction: column; height: 100vh; max-width: 600px; margin: 0 auto; background: #0f172a; }
    .header { background: #1e293b; padding: 15px; text-align: center; border-bottom: 1px solid #334155; font-size: 18px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px 16px; border-radius: 18px; max-width: 80%; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .msg.user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.ai { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
    .controls { background: #1e293b; padding: 10px; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 15px; outline: none; }
    button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    button.draw { background: #8b5cf6; }
    .file-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #94a3b8; padding: 0 5px; }
    img.result-img { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">✨ DEVA-Aİ</div>
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Naber kanka! Ben DEVA-Aİ. İster sohbet edelim ister 'Çiz' butonuna bas resim çizeyim.</div>
    </div>
    <div class="controls">
      <div class="file-row">
        <span>Fotoğraf:</span>
        <input type="file" id="imageInput" accept="image/*">
      </div>
      <div class="input-row">
        <input type="text" id="userInput" placeholder="Mesaj yazın..." onkeydown="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()">Gönder</button>
        <button class="draw" onclick="generateImage()">Çiz 🎨</button>
      </div>
    </div>
  </div>
  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    function addMessage(text, sender, imgUrl = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      if (imgUrl) {
        const img = document.createElement('img');
        img.src = imgUrl;
        img.className = 'result-img';
        msgDiv.appendChild(img);
      }
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    async function sendChat() {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      userInput.value = '';
      addMessage('DEVA-Aİ yazıyor...', 'ai');
      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'chat', message: text })
        });
        const data = await response.json();
        chatBox.lastChild.remove();
        addMessage(data.reply || 'Anlayamadım kanka, tekrar desene?', 'ai');
      } catch (err) {
        chatBox.lastChild.remove();
        addMessage('Bağlantı koptu kanka!', 'ai');
      }
    }
    async function generateImage() {
      const text = userInput.value.trim();
      const fileInput = document.getElementById('imageInput');
      if (!text) return alert('Resim için ne çizeceğimi yazman lazım!');
      addMessage(`[Resim İsteği]: ${text}`, 'user');
      userInput.value = '';
      addMessage('Resim çiziliyor...', 'ai');
      let imageUrl = null;
      if (fileInput.files && fileInput.files[0]) {
        imageUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(fileInput.files[0]);
        });
      }
      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'image', prompt: text, image_url: imageUrl })
        });
        const data = await response.json();
        chatBox.lastChild.remove();
        if (data.images && data.images[0]) {
          addMessage('İşte resmin:', 'ai', data.images[0].url);
        } else {
          addMessage('Resim çizilemedi!', 'ai');
        }
      } catch (err) {
        chatBox.lastChild.remove();
        addMessage('Sunucu hatası!', 'ai');
      }
    }
  </script>
</body>
</html>
