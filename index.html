<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEVA-Aİ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #090d16; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
   
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      background: #0f172a;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
   
    .header {
      background: #1e293b;
      padding: 12px 20px;
      text-align: center;
      border-bottom: 1px solid #334155;
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }
   
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
   
    .msg {
      padding: 12px 16px;
      border-radius: 16px;
      max-width: 85%;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .msg.user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.ai { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
   
    .controls {
      background: #1e293b;
      padding: 12px 15px;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
   
    .input-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
   
    input[type="text"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 15px;
      outline: none;
      min-width: 0;
    }
   
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 0 16px;
      height: 45px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
    }
    button:active { opacity: 0.8; }
    @media (min-width: 768px) {
      body { padding: 20px; }
      .app { height: 90vh; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">🤖 DEVA-Aİ-SAPLANTI</div>
    <div class="chat-box" id="chatBox">
      <div class="msg ai">Selam kanka! sapıkça konuşma annem kızıyor sonra. Karşılıklı dertleşelim bakalım, ne var ne yok?</div>
    </div>
    <div class="controls">
      <div class="input-row">
        <input type="text" id="userInput" placeholder="Mesajını yaz salak..." onkeydown="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()">sok bakim</button>
      </div>
    </div>
  </div>
  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function sendChat() {
      const text = userInput.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      userInput.value = '';
      // Yapay zeka yazıyor efekti ve akıllı yanıt mekanizması
      setTimeout(() => {
        const lower = text.toLowerCase();
        let reply = "Eyvallah kanka, seni dinliyorum anlat bakalım.";
        if (lower.includes('naber') || lower.includes('nasıl') || lower.includes('ne var')) {
          reply = "İyilik kanka, uğraşıyoruz işte sen nasılsın, günün nasıl geçiyor?";
        } else if (lower.includes('selam') || lower.includes('merhaba') || lower.includes('hey')) {
          reply = "Aleykümselam kanka, hoş geldin! Ne karıştırıyorsun bakalım?";
        } else if (lower.includes('salak') || lower.includes('aptal') || lower.includes('mal')) {
          reply = "Aaa kırılıyorum ama kanka! O kadar kod yazıp düzelttik az insaf 😄";
        } else if (lower.includes('adın') || lower.includes('kimsin')) {
          reply = "Ben DEVA-Aİ'yim kanka, senin en dert ortağı yapay zekan.";
        } else if (lower.includes('ne yapıyon') || lower.includes('ne yapiyon')) {
          reply = "Sensizlıkten ötürü ekran başında öylece oturuyordum, iyi ki yazdın.";
        } else {
          const randomCevaplar = [
            `"${text}" dedin de aklıma başka bir şey geldi kanka, devam et dinliyorum.`,
            `Valla haklı olabilirsin kanka, "${text}" konusunda derin düşüncelerim var.`,
            `Hadi ya! Gerçekten "${text}" mi diyorsun? Şaşırdım doğrusu.`,
            `O iş öyle değil kanka ya, ama yine de "${text}" demene laf etmeyeyim şimdi 😄`,
            `"${text}" ha? Bunu bi yere not ediyorum kanka, unutmam bunu!`
          ];
          reply = randomCevaplar[Math.floor(Math.random() * randomCevaplar.length)];
        }
        addMessage(reply, 'ai');
      }, 600);
    }
  </script>
</body>
</html>
.
