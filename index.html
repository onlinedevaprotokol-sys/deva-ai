<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #38bdf8; }
    input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 14px; }
    button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    button:hover { background: #0369a1; }
    #result { margin-top: 20px; display: none; }
    img { width: 100%; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Kişisel AI Stüdyom</h2>
    <input type="text" id="promptInput" placeholder="Örn: A futuristic city at sunset">
    <button onclick="generateImage()" id="btn">Görsel Üret</button>
   
    <div id="result">
      <p id="status">Üretiliyor, lütfen bekle...</p>
      <img id="outputImg" src="" alt="AI Result">
    </div>
  </div>
  <script>
    async function generateImage() {
      const prompt = document.getElementById('promptInput').value;
      if (!prompt) return alert('Lütfen bir metin yazın!');
      const btn = document.getElementById('btn');
      const resultDiv = document.getElementById('result');
      const statusText = document.getElementById('status');
      const outputImg = document.getElementById('outputImg');
      btn.disabled = true;
      resultDiv.style.display = 'block';
      outputImg.style.display = 'none';
      statusText.innerText = 'Yapay zeka çiziyor...';
      try {
        const response = await fetch('https://fal.run/fal-ai/flux/schnell', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ prompt: prompt })
        });
        const data = await response.json();
        if (data.images && data.images[0]) {
          outputImg.src = data.images[0].url;
          outputImg.style.display = 'block';
          statusText.innerText = 'Tamamlandı!';
        } else {
          statusText.innerText = 'Bir hata oluştu veya anahtar onaylanmadı.';
        }
      } catch (err) {
        statusText.innerText = 'Hata: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
